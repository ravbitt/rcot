# Despliegue completo (app + Postgres) para Coolify: Build Pack «Docker Compose».
# Las variables SERVICE_* las genera Coolify en el primer despliegue y las conserva:
#   SERVICE_URL_APP_3000        dominio público de la app (puerto interno 3000)
#   SERVICE_USER/PASSWORD_POSTGRES  credenciales de la base
#   SERVICE_BASE64_64_AUTHSECRET    secreto de Better Auth
# Tú defines ADMIN_EMAIL y ADMIN_PASSWORD (mín. 10 caracteres) en Environment Variables de Coolify.
# La contraseña se aplica en cada arranque: para cambiarla, edita ADMIN_PASSWORD y redespliega.

services:
  app:
    build:
      context: .
      args:
        # Opcional (recomendado): clave fija de las Server Actions, `openssl rand -base64 32`
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}
    environment:
      SERVICE_URL_APP_3000: ""
      BETTER_AUTH_URL: ${SERVICE_URL_APP_3000}
      # Acepta el dominio con https y http: un cambio de protocolo en Coolify no rompe el ingreso
      BETTER_AUTH_TRUSTED_ORIGINS: https://${SERVICE_FQDN_APP_3000},http://${SERVICE_FQDN_APP_3000}
      BETTER_AUTH_SECRET: ${SERVICE_BASE64_64_AUTHSECRET}
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@db:5432/cotas
      ADMIN_EMAIL: ${ADMIN_EMAIL:?}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
    volumes:
      # Modelos subidos (STEP originales y mallas convertidas)
      - cotas-uploads:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # El healthcheck (/api/health) viene del Dockerfile

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: cotas
    volumes:
      - cotas-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d cotas"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  cotas-uploads:
  cotas-pg:
